name: Claude Code Assistant

# Issue / PR コメントで `@claude` をメンションすると Claude Code が起動して作業し PR を出す。
# `anthropics/claude-code-action` の内部で event 本文をパースするため command injection の懸念は無い。
# 認証は以下のいずれかを Repository Secret に設定して、対応する input に渡す：
# - Max サブスクの OAuth トークン → `claude_code_oauth_token:` input
# - API クレジット課金の API キー → `anthropic_api_key:` input
# 入力名を取り違えると Anthropic 側で `Invalid API key` 拒否されるため注意。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 公開リポでの API 消費悪用を防ぐため、owner のコメント・レビューにのみ反応。
    # さらに、コメント対象の Issue/PR 自体の作成者が owner/member/collaborator
    # でない場合は起動しない。owner を騙って反応させても、フォーク PR 等に
    # 埋め込まれた第三者の指示文（プロンプトインジェクション）を、書き込み権限を
    # 持つエージェントに読ませないための防御（トリガーした人物だけでなく、
    # エージェントが読み書き対象とする内容の出どころも検証する）。
    if: |
      github.repository_owner == github.actor &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.pull_request.author_association || github.event.issue.author_association
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Reject fork-originated PRs (pwn request guard)
        # owner のコメントは「誰が起動したか」しか保証しない。コメント対象の PR が
        # フォーク（別リポジトリ）由来の場合、そのブランチ内容は攻撃者制御下にあり得るため、
        # secrets と contents:write 等の権限を持つ claude step を実行させない。
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          number=""
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # PR ではない通常の issue コメントならフォーク由来のブランチは無関係
            if [ -n "$ISSUE_PR_URL" ]; then
              number="$ISSUE_NUMBER"
            fi
          else
            number="$REVIEW_PR_NUMBER"
          fi

          if [ -z "$number" ]; then
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_fork=$(gh pr view "$number" --json isCrossRepository --jq .isCrossRepository)
          echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"

      - id: claude
        if: steps.guard.outputs.is_fork != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Open Draft PR for Claude branch
        # Claude Code Action が変更を push したら、その作業ブランチに対して
        # 自動で Draft PR を立てる。マージ判断は owner が行う前提。
        # branch_name は信頼値だが env 経由で渡し shell では引用展開する（command injection 防御）。
        if: success() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            echo "PR already exists for $BRANCH (#$existing)"
            exit 0
          fi
          gh pr create --draft \
            --head "$BRANCH" \
            --base develop \
            --fill
