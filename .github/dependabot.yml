# Dependabot 設定
#
# 依存関係の自動更新 PR を週次で起こす。
# プロジェクトに該当するエコシステムが無い場合は `package-ecosystem` ブロックごと削除すること。
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    ignore:
      # Expo / React Native は SDK 単位でバージョンを揃える必要があり、
      # dependabot の個別 bump は SDK 不整合を招くため対象外にする（SDK は手動で更新する）。
      # 参照: PR #45（@expo/metro-runtime を SDK52 環境へ SDK57 用へ誤 bump した事例）
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      # スコープ付きの RN コミュニティ製パッケージは上の `react-native-*` に
      # マッチしないため個別に指定する。Expo Go 同梱のネイティブ実装と JS 側の
      # バージョンがずれると、例外を出さずに機能だけ壊れる。
      # 参照: Issue #96（PR #66 で SDK54 想定の 2.2.0 → 3.1.1 へ誤 bump し永続化が無言で失敗した事例）
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      # react / react-dom / @types/react は react-native 内蔵 renderer との完全一致が必須のため、
      # pnpm-workspace.yaml の catalog で Expo SDK 対応バージョンに一元管理し、SDK 更新時に手動で上げる。
      # 参照: PR #67/#68（dependabot が react を 19.1.0→19.2.7 へ個別 bump し起動不能になった事例）
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # react-native-worklets / gesture-handler の Babel プラグインは Babel 7 系のみ対応。
      # Babel 8 への major bump はバンドル不能を招くため、worklets 側の対応まで major を無視する。
      # 参照: Issue #80（PR #46/#65 で 2 度誤 bump された事例）
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
